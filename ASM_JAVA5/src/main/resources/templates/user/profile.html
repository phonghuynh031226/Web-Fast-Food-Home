<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Tài khoản của tôi - Fast Food Home</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#1c0e0d] dark:text-[#fafaf9] transition-colors duration-300">
<div th:replace="layout/header :: header"></div>
<main class="flex-grow max-w-screen-2xl mx-auto w-full px-6 py-10">
    <section class="mb-12">
        <div class="relative h-48 md:h-64 rounded-xl overflow-hidden bg-gradient-to-r from-primary/80 to-orange-300">
            <img alt="Tài khoản của tôi" class="w-full h-full object-cover opacity-40" src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=1600&q=80"/>
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-8">
                <h1 class="text-white text-4xl md:text-5xl font-black tracking-tight uppercase">Tài khoản của tôi</h1>
            </div>
        </div>
    </section>

    <div class="mb-6 rounded-xl bg-green-50 text-green-700 px-5 py-4 font-bold" th:if="${success}" th:text="${success}"></div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
        <section class="bg-surface p-8 rounded-xl shadow-[0_20px_50px_rgba(242,32,13,0.05)] h-full">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-extrabold tracking-tight">Thông tin cá nhân</h2>
                <span class="bg-secondary-fixed text-on-secondary-fixed-variant text-[10px] px-3 py-1 rounded-full font-black tracking-widest uppercase">Thành viên</span>
            </div>
            <form class="space-y-6" th:action="@{/profile/update}" method="post">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Họ tên</label>
                    <input name="fullName" class="w-full bg-surface-container border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary/20 font-medium" type="text" th:value="${user.fullName}" required/>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Số điện thoại</label>
                    <input name="phone" class="w-full bg-surface-container border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary/20 font-medium" type="tel" th:value="${user.phone}" placeholder="Nhập số điện thoại"/>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Email</label>
                    <input class="w-full bg-gray-100 border-none rounded-lg p-3 text-sm font-medium text-gray-500" type="email" th:value="${user.email}" readonly/>
                    <p class="text-xs text-gray-400">Email dùng để đăng nhập nên không chỉnh tại đây.</p>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Địa chỉ</label>
                    <textarea name="address" class="w-full bg-surface-container border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary/20 font-medium h-32 resize-none" placeholder="Nhập địa chỉ giao hàng của bạn..." th:text="${user.address}"></textarea>
                </div>
                <div class="pt-4">
                    <button type="submit" class="w-full md:w-auto bg-primary text-white font-black uppercase text-xs tracking-widest px-10 py-4 rounded-lg shadow-lg shadow-primary/20 hover:scale-[0.98] transition-all">Cập nhật thông tin</button>
                </div>
            </form>
        </section>

        <section class="bg-surface p-8 rounded-xl shadow-[0_20px_50px_rgba(242,32,13,0.05)] h-full">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-extrabold tracking-tight">Lịch sử đơn hàng</h2>
                <span class="text-primary text-xs font-black uppercase tracking-widest" th:text="${#lists.size(orders)} + ' đơn'"></span>
            </div>
            <div class="rounded-xl border border-dashed border-gray-200 p-8 text-center text-gray-500" th:if="${#lists.isEmpty(orders)}">
                Bạn chưa có đơn hàng nào.
            </div>
            <div class="space-y-4" th:if="${!#lists.isEmpty(orders)}">
                <details class="rounded-xl border border-outline-variant/50 bg-white p-5" th:each="o : ${orders}">
                    <summary class="cursor-pointer list-none">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 items-center">
                            <div>
                                <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-black">Mã đơn</p>
                                <p class="font-black" th:text="'#DH-' + ${o.orderId}"></p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-black">Ngày đặt</p>
                                <p class="text-sm text-on-surface-variant" th:text="${#temporals.format(o.createdAt, 'HH:mm dd/MM/yyyy')}"></p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-black">Thanh toán</p>
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-blue-100 text-blue-800" th:text="${o.paymentMethod == 'ATM' ? 'Chuyển khoản' : 'Tiền mặt'}"></span>
                            </div>
                            <div class="md:text-right">
                                <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-black">Tổng tiền</p>
                                <p class="font-black text-primary" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></p>
                            </div>
                        </div>
                    </summary>
                    <div class="mt-5 pt-5 border-t border-outline-variant/40">
                        <p class="text-sm text-gray-500 mb-3"><b>Giao đến:</b> <span th:text="${o.address}"></span></p>
                        <p class="text-sm text-gray-500 mb-3" th:if="${o.note != null and !#strings.isEmpty(o.note)}"><b>Ghi chú:</b> <span th:text="${o.note}"></span></p>
                        <table class="w-full text-left text-sm">
                            <thead>
                            <tr class="text-[10px] uppercase tracking-widest text-on-surface-variant border-b">
                                <th class="py-2">Món</th>
                                <th class="py-2 text-center">SL</th>
                                <th class="py-2 text-right">Giá</th>
                                <th class="py-2 text-right">Thành tiền</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr class="border-b border-gray-100" th:each="it : ${o.orderItems}">
                                <td class="py-3 font-bold" th:text="${it.itemName}"></td>
                                <td class="py-3 text-center" th:text="${it.quantity}"></td>
                                <td class="py-3 text-right" th:text="${#numbers.formatDecimal(it.price, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                                <td class="py-3 text-right font-bold" th:text="${#numbers.formatDecimal(it.price * it.quantity, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </details>
            </div>
        </section>
    </div>
</main>
<div th:replace="layout/footer :: footer"></div>
</body>
</html>
