<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Trang Chủ - Fast Food Home</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>

</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#1c0e0d] dark:text-[#fafaf9] transition-colors duration-300">
    <div th:replace="layout/header :: header"></div>
    <main class="flex-grow max-w-screen-2xl mx-auto w-full px-6 py-10">
        <!-- Hero Section -->
        <section class="mb-12">
            <div class="relative h-48 md:h-64 rounded-xl overflow-hidden">
                <img alt="Tài khoản của tôi" class="w-full h-full object-cover" data-alt="Modern upscale restaurant interior with red ambient lighting and warm wooden textures, blurred background with bokeh." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCaq-gX0yfoJwtfpiMBmQRgsHOz9EQkI3ffDjc9P38vojvRHJMQILYoxhGJdzk-w1eRWbsGxSXvh1jmsmBcwZplm62r9Fj5e03PyQZjL0ttKHPTHu8ppkexp31abcbu8Nbd-c01-2392L-gqF06xqf9on3jE0lWnjU708NmFujzMthmVUTFdHv4QEIr5fUVTXFAhfJY5lcDiLTjfirDgg_DLarUhuykjqgDLZligvwjKXwKExlfv36KY678KeTlcJHXjoxWSER1GWX4"/>
                <div class="absolute inset-0 bg-gradient-to-t from-on-surface/80 to-transparent flex items-end p-8">
                    <h1 class="text-white text-4xl md:text-5xl font-black tracking-tight uppercase">Tài khoản của tôi</h1>
                </div>
            </div>
        </section>
        <!-- Main Content Area: Two-Column Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
            <!-- Left Column: Personal Information -->
            <section class="bg-surface p-8 rounded-xl shadow-[0_20px_50px_rgba(242,32,13,0.05)] h-full">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-2xl font-extrabold tracking-tight">Thông tin cá nhân</h2>
                    <span class="bg-secondary-fixed text-on-secondary-fixed-variant text-[10px] px-3 py-1 rounded-full font-black tracking-widest uppercase">Member Gold</span>
                </div>
                <form class="space-y-6">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Họ tên</label>
                        <input class="w-full bg-surface-container border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary/20 font-medium" type="text" value="Nguyễn Minh Hoàng"/>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Số điện thoại</label>
                        <input class="w-full bg-surface-container border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary/20 font-medium" type="tel" value="0901 234 567"/>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Email</label>
                        <input class="w-full bg-surface-container border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary/20 font-medium" type="email" value="hoang.nguyen@example.com"/>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold">Địa chỉ</label>
                        <textarea class="w-full bg-surface-container border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-primary/20 font-medium h-32 resize-none" placeholder="Nhập địa chỉ giao hàng của bạn...">123 Đường Lê Lợi, Phường Bến Thành, Quận 1, TP. Hồ Chí Minh</textarea>
                    </div>
                    <div class="pt-4">
                        <button class="w-full md:w-auto bg-primary text-white font-black uppercase text-xs tracking-widest px-10 py-4 rounded-lg shadow-lg shadow-primary/20 hover:scale-[0.98] transition-all">Cập nhật thông tin</button>
                    </div>
                </form>
            </section>
            <!-- Right Column: Order History -->
            <section class="bg-surface p-8 rounded-xl shadow-[0_20px_50px_rgba(242,32,13,0.05)] h-full">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-2xl font-extrabold tracking-tight">Lịch sử đơn hàng</h2>
                    <a class="text-primary text-xs font-black uppercase tracking-widest hover:underline" href="#">Xem tất cả</a>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                        <tr class="border-b border-outline-variant">
                            <th class="pb-4 text-[10px] uppercase tracking-widest text-on-surface-variant font-black">Mã đơn</th>
                            <th class="pb-4 text-[10px] uppercase tracking-widest text-on-surface-variant font-black">Ngày đặt</th>
                            <th class="pb-4 text-[10px] uppercase tracking-widest text-on-surface-variant font-black">Trạng thái</th>
                            <th class="pb-4 text-[10px] uppercase tracking-widest text-on-surface-variant font-black text-right">Tổng tiền</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-outline-variant/30">
                        <tr class="group hover:bg-surface-container-high transition-colors">
                            <td class="py-5 text-sm font-bold">#CU-89234</td>
                            <td class="py-5 text-sm text-on-surface-variant">24/05/2024</td>
                            <td class="py-5">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-green-100 text-green-800">Hoàn thành</span>
                            </td>
                            <td class="py-5 text-sm font-black text-right">1.250.000đ</td>
                        </tr>
                        <tr class="group hover:bg-surface-container-high transition-colors">
                            <td class="py-5 text-sm font-bold">#CU-89102</td>
                            <td class="py-5 text-sm text-on-surface-variant">18/05/2024</td>
                            <td class="py-5">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-blue-100 text-blue-800">Đang giao</span>
                            </td>
                            <td class="py-5 text-sm font-black text-right">450.000đ</td>
                        </tr>
                        <tr class="group hover:bg-surface-container-high transition-colors">
                            <td class="py-5 text-sm font-bold">#CU-88945</td>
                            <td class="py-5 text-sm text-on-surface-variant">10/05/2024</td>
                            <td class="py-5">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-stone-200 text-stone-600">Đã hủy</span>
                            </td>
                            <td class="py-5 text-sm font-black text-right">2.100.000đ</td>
                        </tr>
                        <tr class="group hover:bg-surface-container-high transition-colors">
                            <td class="py-5 text-sm font-bold">#CU-88712</td>
                            <td class="py-5 text-sm text-on-surface-variant">05/05/2024</td>
                            <td class="py-5">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-green-100 text-green-800">Hoàn thành</span>
                            </td>
                            <td class="py-5 text-sm font-black text-right">890.000đ</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
    <div th:replace="layout/footer :: footer"></div>
</body>
</html>
