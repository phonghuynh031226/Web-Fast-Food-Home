<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title></title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>
</head>
<body>
<div th:replace="layout/header :: header"></div>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-16">
    <div class="flex flex-col lg:flex-row gap-12 xl:gap-20">
        <div class="lg:w-1/2">
            <div class="sticky top-28">
                <div class="relative aspect-[4/3] rounded-3xl overflow-hidden custom-shadow group">
                    <img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                         th:src="@{'/images/' + ${item.image}}"
                         th:alt="${item.itemName}">
                </div>
            </div>
        </div>

        <div class="lg:w-1/2 flex flex-col justify-center">
            <div class="space-y-6">
                <div>
                    <h1 class="text-4xl lg:text-5xl font-extrabold tracking-tight leading-tight"
                        th:text="${item.itemName}">
                        Tên sản phẩm
                    </h1>
                </div>

                <div class="flex items-center gap-4">
                    <span class="text-3xl font-extrabold text-primary"
                          th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                        65.000đ
                    </span>
                </div>

                <p class="text-gray-600 dark:text-gray-400 text-lg leading-relaxed"
                   th:text="${item.description}">
                    Mô tả sản phẩm
                </p>

                <div class="pt-6 border-t border-gray-100 dark:border-gray-800 space-y-8">
                    <div class="flex flex-col sm:flex-row gap-4 items-center">
                        <div class="flex items-center bg-gray-100 dark:bg-gray-800 p-1 rounded-xl h-14">
                            <button type="button" id="decreaseQty"
                                    class="w-12 h-full flex items-center justify-center hover:bg-white dark:hover:bg-gray-700 rounded-lg transition-all">
                                <span class="material-symbols-outlined">remove</span>
                            </button>

                            <span id="quantityValue" class="w-12 text-center font-bold text-xl">1</span>

                            <button type="button" id="increaseQty"
                                    class="w-12 h-full flex items-center justify-center hover:bg-white dark:hover:bg-gray-700 rounded-lg transition-all">
                                <span class="material-symbols-outlined">add</span>
                            </button>
                        </div>

                        <form th:action="@{/cart/add}" method="post" class="flex-1 w-full">
                            <input type="hidden" name="itemId" th:value="${item.itemId}">
                            <input type="hidden" name="quantity" id="quantityInput" value="1">

                            <button type="submit"
                                    class="flex-1 w-full bg-primary hover:bg-primary/90 text-white font-extrabold text-lg py-4 px-8 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-3 active:scale-[0.98]">
                                <span class="material-symbols-outlined">add_shopping_cart</span>
                                Thêm vào giỏ hàng
                            </button>
                        </form>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-4">
                    <div class="flex items-center gap-3 text-sm text-gray-500">
                        <span class="material-symbols-outlined text-green-500">timer</span>
                        Giao nhanh trong 30p
                    </div>
                    <div class="flex items-center gap-3 text-sm text-gray-500">
                        <span class="material-symbols-outlined text-green-500">verified</span>
                        Nguyên liệu sạch
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="mt-24">
        <div class="flex items-end justify-between mb-8">
            <div>
                <h3 class="text-sm font-extrabold text-primary uppercase tracking-[0.2em] mb-2">Combo ngon hơn</h3>
                <h2 class="text-3xl font-extrabold tracking-tight">Món ăn kèm gợi ý</h2>
            </div>
        </div>

        <div class="flex overflow-x-auto gap-6 pb-8 hide-scrollbar">
            <div class="min-w-[280px] bg-white dark:bg-gray-800 rounded-2xl p-4 custom-shadow group"
                 th:each="s : ${suggestedItems}">
                <div class="relative aspect-square rounded-xl overflow-hidden mb-4">
                    <img class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                         th:src="@{'/images/' + ${s.image}}"
                         th:alt="${s.itemName}">
                </div>

                <h4 class="font-bold text-lg mb-1" th:text="${s.itemName}">Tên món</h4>

                <div class="flex items-center justify-between mt-4">
                    <span class="font-extrabold text-primary"
                          th:text="${#numbers.formatDecimal(s.price, 0, 'COMMA', 0, 'POINT')} + 'đ'">
                        28.000đ
                    </span>

                    <a th:href="@{/product/detail/{id}(id=${s.itemId})}"
                       class="w-10 h-10 bg-primary/10 text-primary rounded-full flex items-center justify-center hover:bg-primary hover:text-white transition-all">
                        <span class="material-symbols-outlined">add</span>
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

<div th:replace="layout/footer :: footer"></div>
</body>
</html>
