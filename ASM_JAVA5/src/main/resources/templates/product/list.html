<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title></title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>

</head>
<body>
<div th:replace="layout/header :: header"></div>
<main class="max-w-[1280px] mx-auto flex flex-col md:flex-row gap-8 px-6 py-8">
    <div th:replace="layout/menu :: menu"></div>
    <section class="flex-1">
        <div class="flex items-center justify-between mb-8 overflow-x-auto pb-2">
            <div class="hidden sm:flex items-center gap-2">
                <span class="text-xs font-medium text-gray-500">Sắp xếp:</span>
                <select class="text-xs font-bold border-none bg-transparent focus:ring-0 p-0 pr-6">
                    <option>Phổ biến nhất</option>
                    <option>Giá: Thấp đến Cao</option>
                    <option>Giá: Cao đến Thấp</option>
                </select>
            </div>
        </div>

        <div class="product-grid">
            <div class="group bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 dark:border-gray-700" th:each="item : ${items}">
                <div class="relative h-48 w-full overflow-hidden">
                    <div class="absolute top-3 left-3 z-10 bg-accent-yellow text-gray-900 text-[10px] font-black px-2 py-1 rounded-lg uppercase shadow-sm">Hot</div>
                    <img alt="Gà Rán Giòn Cay" class="h-full w-full object-cover group-hover:scale-110 transition-transform duration-500"
                         th:alt="${item.itemName}"
                         th:src="@{'/images/' + ${item.image}}"/>
                </div>
                <div class="p-4">
                    <h3 class="font-extrabold text-lg leading-tight mb-1" th:text="${item.itemName}"></h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 line-clamp-1" th:text="${item.description}"></p>
                    <div class="flex flex-col gap-3">
                        <span class="text-primary font-extrabold text-lg" th:text="${#numbers.formatDecimal(item.price, 0, 'POINT', 0, 'NONE')} + 'đ'"></span>
                        <a class="w-full bg-primary text-white py-2.5 rounded-xl flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors shadow-lg shadow-primary/10" th:href="@{/product/detail/{id}(id=${item.itemId})}">
                            <span class="material-symbols-outlined text-lg">info</span>
                            <span class="text-sm font-bold">Xem chi tiết</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-12 flex justify-center">
            <button class="px-8 py-3 rounded-xl border-2 border-primary text-primary font-bold hover:bg-primary hover:text-white transition-all">
                Xem Thêm Món Ngon
            </button>
        </div>
    </section>
</main>
<div th:replace="layout/footer :: footer"></div>

</body>
</html>
