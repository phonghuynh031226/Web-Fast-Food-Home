<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quản lý đơn hàng</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-body">
<div th:replace="admin/layout/sidebar :: sidebar"></div>
<main class="admin-main">
    <div class="admin-page-head"><h2>Quản lý đơn hàng</h2>
        <p>Xem thông tin khách, danh sách món trong từng đơn và tổng tiền.</p></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <section class="admin-card order-list" th:if="${!#lists.isEmpty(orders)}">
        <article class="order-card" th:each="o:${orders}">
            <div class="order-head">
                <div><h3 th:text="'#DH-' + ${o.orderId}">#DH</h3>
                    <p th:text="${#temporals.format(o.createdAt,'HH:mm dd/MM/yyyy')}">date</p></div>
                <div class="order-total" th:text="${#numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT')} + 'đ'">
                    0đ
                </div>
            </div>
            <div class="order-info">
                <div><span>Khách hàng</span><strong th:text="${o.customerName}">Khách</strong></div>
                <div><span>Số điện thoại</span><strong th:text="${o.phone}">phone</strong></div>
                <div><span>Địa chỉ</span><strong th:text="${o.address}">address</strong></div>
                <div><span>Thanh toán</span><strong th:text="${o.paymentMethod == 'ATM' ? 'Chuyển khoản' : 'Tiền mặt'}">Tiền
                    mặt</strong></div>
            </div>
            <p class="order-note" th:if="${o.note}" th:text="'Ghi chú: ' + ${o.note}">note</p>
            <div class="order-detail"><h4>Sản phẩm trong đơn</h4>
                <table class="admin-table compact">
                    <thead>
                    <tr>
                        <th>Món</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="it:${o.orderItems}">
                        <td th:text="${it.itemName}">Món</td>
                        <td th:text="${#numbers.formatDecimal(it.price,0,'COMMA',0,'POINT')} + 'đ'">0đ</td>
                        <td th:text="${it.quantity}">1</td>
                        <td class="money"
                            th:text="${#numbers.formatDecimal(it.price * it.quantity,0,'COMMA',0,'POINT')} + 'đ'">0đ
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(o.orderItems)}">
                        <td class="empty" colspan="4">Đơn này chưa có chi tiết sản phẩm</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <form class="order-actions" method="post" th:action="@{/admin/order/delete}"><input name="orderId"
                                                                                                th:value="${o.orderId}"
                                                                                                type="hidden">
                <button class="btn btn-danger" onclick="return confirm('Xóa đơn hàng này?')">Xóa đơn</button>
            </form>
        </article>
    </section>
    <section class="admin-card empty big" th:if="${#lists.isEmpty(orders)}">Chưa có đơn hàng</section>
</main>
</body>
</html>
