<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title></title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#f2200d",
                    "background-light": "#fafaf9",
                    "background-dark": "#1a1a1a",
                    "sidebar-dark": "#1c1c1c",
                },
                fontFamily: {
                    "display": ["Plus Jakarta Sans", "sans-serif"]
                },
                borderRadius: {
                    "DEFAULT": "0.5rem",
                    "lg": "1rem",
                    "xl": "1.5rem",
                    "full": "9999px"
                },
            },
        },
    }
  </script>
  <style type="text/tailwindcss">
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .active-nav {
        background-color: #f2200d;
        color: white !important;
    }
    .stat-card {
        background: #ffffff;
        transition: transform 0.2s ease;
    }
    .dark .stat-card {
        background: rgba(40, 40, 40, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#1c0e0d] dark:text-gray-100 min-h-screen flex">
<div th:replace="~{admin/layout/sidebar :: sidebar}"></div>
<main class="flex-1 flex flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
  <div th:replace="~{admin/layout/header :: header}"></div>
  <div class="p-10 flex-1">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="stat-card p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-white/5">
        <div class="flex items-center justify-between mb-4">
          <div class="size-12 bg-primary/10 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-primary text-2xl">restaurant_menu</span>
          </div>
          <div class="flex items-center gap-1 text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-lg">
            <span class="material-symbols-outlined text-xs">trending_up</span>
            +5.2%
          </div>
        </div>
        <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Tổng món ăn</p>
        <p class="text-3xl font-extrabold text-[#1c0e0d] dark:text-white mt-1">85</p>
      </div>
      <div class="stat-card p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-white/5">
        <div class="flex items-center justify-between mb-4">
          <div class="size-12 bg-amber-500/10 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-amber-500 text-2xl">lunch_dining</span>
          </div>
          <div class="flex items-center gap-1 text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-lg">
            <span class="material-symbols-outlined text-xs">trending_up</span>
            +2.4%
          </div>
        </div>
        <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Tổng combo</p>
        <p class="text-3xl font-extrabold text-[#1c0e0d] dark:text-white mt-1">24</p>
      </div>
      <div class="stat-card p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-white/5">
        <div class="flex items-center justify-between mb-4">
          <div class="size-12 bg-blue-500/10 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-blue-500 text-2xl">receipt_long</span>
          </div>
          <div class="flex items-center gap-1 text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-lg">
            <span class="material-symbols-outlined text-xs">trending_up</span>
            +12.8%
          </div>
        </div>
        <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Tổng đơn hàng</p>
        <p class="text-3xl font-extrabold text-[#1c0e0d] dark:text-white mt-1">1,240</p>
      </div>
      <div class="stat-card p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-white/5">
        <div class="flex items-center justify-between mb-4">
          <div class="size-12 bg-purple-500/10 rounded-xl flex items-center justify-center">
            <span class="material-symbols-outlined text-purple-500 text-2xl">group</span>
          </div>
          <div class="flex items-center gap-1 text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-lg">
            <span class="material-symbols-outlined text-xs">trending_up</span>
            +8.1%
          </div>
        </div>
        <p class="text-gray-500 text-xs font-bold uppercase tracking-wider">Tổng người dùng</p>
        <p class="text-3xl font-extrabold text-[#1c0e0d] dark:text-white mt-1">5,600</p>
      </div>
    </div>
    <div class="mt-10 min-h-[400px] rounded-3xl border-2 border-dashed border-gray-200 dark:border-white/5 flex flex-col items-center justify-center text-gray-400">
      <span class="material-symbols-outlined text-5xl mb-4">analytics</span>
      <p class="font-medium text-sm">Sẵn sàng cho các widget tổng hợp dữ liệu mới</p>
    </div>
  </div>
  <div th:replace="~{admin/layout/footer :: footer}"></div>
</main>

</body></html>
