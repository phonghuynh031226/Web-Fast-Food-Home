<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quản lý người dùng</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-body">
<div th:replace="admin/layout/sidebar :: sidebar"></div>
<main class="admin-main">
    <div class="admin-page-head"><h2>Quản lý người dùng</h2>
        <p>Admin không tự tạo tài khoản khách. Trang này chỉ dùng để xem thông tin và nâng/hạ vai trò.</p></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <section class="admin-card table-card">
        <div class="table-wrap">
            <table class="admin-table user-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Số điện thoại</th>
                    <th>Địa chỉ</th>
                    <th>Vai trò hiện tại</th>
                    <th>Cập nhật vai trò</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u:${users}">
                    <td class="font-bold" th:text="${u.userId}">1</td>
                    <td th:text="${u.fullName}">Tên</td>
                    <td th:text="${u.email}">email</td>
                    <td th:text="${u.phone}">phone</td>
                    <td th:text="${u.address}">address</td>
                    <td><span th:class="${u.role == 'admin'} ? 'badge red' : 'badge green'"
                              th:text="${u.role == 'admin' ? 'Quản trị viên' : 'Khách hàng'}">Vai trò</span></td>
                    <td>
                        <form class="role-form" method="post" th:action="@{/admin/user/role}"><input name="userId"
                                                                                                     th:value="${u.userId}"
                                                                                                     type="hidden"><select
                                name="role">
                            <option th:selected="${u.role == 'customer'}" value="customer">Khách hàng</option>
                            <option th:selected="${u.role == 'admin'}" value="admin">Quản trị viên</option>
                        </select>
                            <button class="btn btn-primary">Lưu</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td class="empty" colspan="7">Chưa có người dùng</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
