<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quản lý sản phẩm</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="admin-body">
<div th:replace="admin/layout/sidebar :: sidebar"></div>
<main class="admin-main">
    <div class="admin-page-head"><h2>Quản lý sản phẩm</h2>
        <p>Thêm món, cập nhật giá, ảnh, danh mục và trạng thái bán.</p></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <section class="admin-card form-card"><h3
            th:text="${itemForm.itemId == null ? 'Thêm sản phẩm' : 'Sửa sản phẩm #' + itemForm.itemId}">Thêm sản
        phẩm</h3>
        <form class="admin-form" method="post" th:action="@{/admin/product/save}"><input name="itemId" th:value="${itemForm.itemId}"
                                                                                         type="hidden">
            <label><span>Tên món</span><input name="itemName" required th:value="${itemForm.itemName}"></label>
            <label><span>Danh mục</span><select name="menuId" required>
                <option th:each="m:${menus}" th:selected="${itemForm.menu != null and itemForm.menu.menuId == m.menuId}" th:text="${m.menuName}"
                        th:value="${m.menuId}"></option>
            </select></label>
            <label><span>Giá</span><input min="0" name="price" required step="1000" th:value="${itemForm.price}"
                                          type="number"></label>
            <label><span>Ảnh / URL ảnh</span><input name="image" th:value="${itemForm.image}"></label>
            <label class="wide"><span>Mô tả</span><input name="description" th:value="${itemForm.description}"></label>
            <label class="check"><input name="status" th:checked="${itemForm.status}" type="checkbox"
                                        value="true"><span>Đang bán</span></label>
            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Lưu sản phẩm</button>
                <a class="btn btn-muted" th:href="@{/admin/product}">Làm mới</a></div>
        </form>
    </section>
    <section class="admin-card table-card">
        <div class="table-wrap">
            <table class="admin-table product-table">
                <thead>
                <tr>
                    <th>Ảnh</th>
                    <th>Tên món</th>
                    <th>Giá</th>
                    <th>Danh mục</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item:${items}">
                    <td><img
                            class="product-thumb"
                            onerror="this.src='/img/logo.jpg'" th:src="${item.image != null and !#strings.isEmpty(item.image) ? item.image : '/img/logo.jpg'}"></td>
                    <td><p class="font-bold" th:text="${item.itemName}">Tên</p>
                        <p class="muted" th:text="'ID: #' + ${item.itemId}">ID</p></td>
                    <td class="money" th:text="${#numbers.formatDecimal(item.price,0,'COMMA',0,'POINT')} + 'đ'">0đ</td>
                    <td th:text="${item.menu.menuName}">Danh mục</td>
                    <td><span th:class="${item.status} ? 'badge green' : 'badge red'"
                              th:text="${item.status} ? 'Đang bán' : 'Đã ẩn'"></span></td>
                    <td>
                        <div class="row-actions"><a class="btn btn-edit"
                                                    th:href="@{/admin/product(editId=${item.itemId})}">Sửa</a>
                            <form method="post" th:action="@{/admin/product/delete}" th:if="${item.status}"><input
                                    name="itemId" th:value="${item.itemId}" type="hidden">
                                <button class="btn btn-danger" onclick="return confirm('Ẩn sản phẩm này?')">Ẩn</button>
                            </form>
                            <form method="post" th:action="@{/admin/product/restore}" th:unless="${item.status}"><input
                                    name="itemId" th:value="${item.itemId}" type="hidden">
                                <button class="btn btn-success">Mở bán</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}">
                    <td class="empty" colspan="6">Chưa có sản phẩm</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
