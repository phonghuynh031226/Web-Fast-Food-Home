<header th:fragment="header" xmlns:th="http://www.thymeleaf.org" class="h-20 border-b border-gray-200 dark:border-white/5 flex items-center justify-between px-10 bg-white/50 dark:bg-background-dark/50 backdrop-blur-md sticky top-0 z-10">
    <div class="flex items-center gap-4">
        <h2 class="text-2xl font-extrabold tracking-tight text-[#1c0e0d] dark:text-white">Thống Kê Tổng Quan</h2>
        <div class="h-6 w-px bg-gray-200 dark:bg-white/10 mx-2"></div>
        <nav class="flex text-sm text-gray-500 font-medium">
            <span>Menu</span>
            <span class="mx-2">/</span>
            <span class="text-primary">Dashboard</span>
        </nav>
    </div>
    <div class="flex items-center gap-6">
        <div class="relative group">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary transition-colors">search</span>
            <input class="bg-gray-100 dark:bg-white/5 border-none rounded-xl pl-10 pr-4 py-2.5 text-sm w-72 focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="Tìm kiếm dữ liệu..." type="text"/>
        </div>
        <button class="size-10 rounded-xl bg-white dark:bg-white/5 border border-gray-200 dark:border-white/10 flex items-center justify-center text-gray-500 hover:text-primary hover:border-primary/30 transition-all relative">
            <span class="material-symbols-outlined">notifications</span>
            <span class="absolute top-2.5 right-2.5 size-2 bg-primary rounded-full border-2 border-white dark:border-background-dark"></span>
        </button>
    </div>
</header>
