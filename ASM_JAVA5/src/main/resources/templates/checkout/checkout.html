<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Thanh toán</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/script.js}"></script>
</head>
<body>
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
    <div th:replace="layout/header :: header"></div>
    <main class="flex-1 max-w-[1200px] mx-auto w-full px-4 lg:px-10 py-8">
        <div class="flex items-center gap-2 mb-6">
            <a class="text-[#9c5049] dark:text-white/60 text-sm font-medium hover:underline" th:href="@{/cart}">Giỏ hàng</a>
            <span class="text-[#9c5049] dark:text-white/40 text-sm">/</span>
            <span class="text-[#1c0e0d] dark:text-white text-sm font-bold">Thanh toán</span>
        </div>
        <div class="mb-10">
            <h1 class="text-[#1c0e0d] dark:text-white text-4xl lg:text-5xl font-black leading-tight tracking-[-0.033em]">Thanh toán</h1>
            <p class="text-[#9c5049] dark:text-white/60 text-lg font-medium mt-1">Hoàn tất đơn hàng của bạn</p>
            <p th:if="${checkoutError}" th:text="${checkoutError}" class="mt-3 text-red-600 font-bold"></p>
        </div>

        <form th:action="@{/checkout}" method="post" class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <div class="lg:col-span-7 flex flex-col gap-10">
                <section>
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <span class="bg-primary/10 text-primary w-8 h-8 rounded-full flex items-center justify-center text-sm">1</span>
                        Thông tin giao hàng
                    </h2>
                    <div class="bg-white dark:bg-[#252525] p-6 rounded-xl border border-[#e8d1ce] dark:border-[#333] flex flex-col gap-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-bold text-[#9c5049] dark:text-white/60 uppercase tracking-widest">Họ và tên</label>
                                <input name="customerName" required class="bg-background-light dark:bg-[#333] border-none rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary" th:value="${user.fullName}" type="text"/>
                            </div>
                            <div class="flex flex-col gap-2">
                                <label class="text-xs font-bold text-[#9c5049] dark:text-white/60 uppercase tracking-widest">Số điện thoại</label>
                                <input name="phone" required class="bg-background-light dark:bg-[#333] border-none rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary" th:value="${user.phone}" type="tel"/>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-xs font-bold text-[#9c5049] dark:text-white/60 uppercase tracking-widest">Địa chỉ giao hàng / Cửa hàng</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#9c5049] dark:text-white/40">location_on</span>
                                <input name="address" required class="w-full bg-background-light dark:bg-[#333] border-none rounded-lg pl-10 pr-4 py-3 focus:ring-1 focus:ring-primary" th:value="${user.address}" placeholder="Nhập địa chỉ của bạn" type="text"/>
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-xs font-bold text-[#9c5049] dark:text-white/60 uppercase tracking-widest">Ghi chú</label>
                            <textarea name="note" class="bg-background-light dark:bg-[#333] border-none rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary" placeholder="Ví dụ: Giao ở cổng sau, gọi khi đến..." rows="3"></textarea>
                        </div>
                    </div>
                </section>
                <section>
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <span class="bg-primary/10 text-primary w-8 h-8 rounded-full flex items-center justify-center text-sm">2</span>
                        Phương thức thanh toán
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="flex items-center gap-3 p-4 border border-[#e8d1ce] dark:border-[#333] rounded-xl bg-white dark:bg-[#252525] cursor-pointer hover:border-primary transition-colors">
                            <input checked class="text-primary focus:ring-primary" name="paymentMethod" value="CASH" type="radio"/>
                            <span class="text-sm font-bold">Tiền mặt</span>
                        </label>
                        <label class="flex items-center gap-3 p-4 border border-[#e8d1ce] dark:border-[#333] rounded-xl bg-white dark:bg-[#252525] cursor-pointer hover:border-primary transition-colors">
                            <input class="text-primary focus:ring-primary" name="paymentMethod" value="ATM" type="radio"/>
                            <span class="text-sm font-bold">Chuyển khoản</span>
                        </label>
                    </div>
                </section>
            </div>
            <div class="lg:col-span-5">
                <div class="sticky top-24 bg-white dark:bg-[#252525] rounded-xl border border-[#e8d1ce] dark:border-[#333] overflow-hidden shadow-2xl shadow-primary/5">
                    <div class="p-6">
                        <h2 class="text-[#1c0e0d] dark:text-white text-xl font-bold mb-6">Tóm tắt đơn hàng</h2>
                        <div class="flex flex-col gap-4 mb-8">
                            <div class="flex items-center gap-4" th:each="entry : ${cart}">
                                <img class="w-14 h-14 bg-gray-100 dark:bg-[#333] rounded-lg object-cover shrink-0" th:src="@{'/img/' + ${entry.value.item.image}}" th:alt="${entry.value.item.itemName}">
                                <div class="flex-1">
                                    <p class="font-bold text-sm"><span th:text="${entry.value.item.itemName}">Tên món</span> x<span th:text="${entry.value.quantity}">1</span></p>
                                    <p class="text-xs text-[#9c5049] dark:text-white/40" th:text="${#numbers.formatDecimal(entry.value.totalPrice,0,'COMMA',0,'POINT')} + 'đ'"></p>
                                </div>
                            </div>
                        </div>
                        <div class="flex flex-col gap-4 mb-6 pt-6 border-t border-[#e8d1ce] dark:border-[#333]">
                            <div class="flex justify-between items-center">
                                <span class="text-[#9c5049] dark:text-white/60 font-medium">Tạm tính</span>
                                <span class="text-[#1c0e0d] dark:text-white font-bold" th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + 'đ'"></span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[#9c5049] dark:text-white/60 font-medium">Phí giao hàng</span>
                                <span class="text-[#1c0e0d] dark:text-white font-bold">0đ</span>
                            </div>
                        </div>
                        <div class="border-t border-dashed border-[#e8d1ce] dark:border-[#444] pt-6 mb-8">
                            <div class="flex justify-between items-end">
                                <span class="text-lg font-bold dark:text-white">Tổng cộng</span>
                                <span class="text-3xl font-black text-primary" th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + 'đ'"></span>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-primary text-white py-4 rounded-xl font-black text-lg shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all flex items-center justify-center gap-3">
                            XÁC NHẬN THANH TOÁN
                            <span class="material-symbols-outlined">check_circle</span>
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </main>
    <div th:replace="layout/footer :: footer"></div>
</div>
</body>
</html>
